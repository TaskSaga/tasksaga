name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Node / React Native
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install JS deps
        run: npm ci
        working-directory: ./

      - name: Lint JS/TS code
        run: npx eslint .
        working-directory: ./

      - name: Format JS/TS code
        run: npx prettier --write .
        working-directory: ./

